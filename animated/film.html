<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Saddest Empires, the film</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --bg: #ffffff; }            /* LineScene fills with --bg: white, so it multiplies cleanly onto paper */
  html, body { margin: 0; background: #000; overflow: hidden; }
  #film { display: block; width: 1920px; height: 1080px; }
  .offstage { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; visibility: hidden; pointer-events: none; }
</style>
</head>
<body>
<canvas id="film" width="1920" height="1080"></canvas>
<canvas id="line-a" class="offstage"></canvas>
<canvas id="line-b" class="offstage"></canvas>
<canvas id="line-c" class="offstage"></canvas>
<script src="line.js"></script>
<script src="film.js"></script>
</body>
</html>
